# Lint, typecheck and test for every change that is not only assets or compositions.
# Holds no secrets and only a read-only token. Pull requests from forks that change code run
# their own tests here, so GitHub's "require approval for outside contributors" setting should
# stay on (see SECURITY.md).
name: Code CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "assets/**"
      - "compositions/**"

permissions:
  contents: read

jobs:
  test:
    name: Lint, typecheck and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
